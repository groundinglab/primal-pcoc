# Android bridge workspace.
# hike is vendored from pcoc PR #48 head 4043f35 (walk specialize + sha2 asm).
# TODO: re-vendor from the ref-rust tag after pcoc #48 merges.
# Live Bari and index hosts default to groundinglab.io; other https origins warn and proceed.
[workspace]
resolver = "2"
members = ["vendor/hike", "bridge"]

[profile.dev.package."*"]
# Legs are not usable unoptimised. Same choice as the desktop app.
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# No panic = "abort": jni.rs and produce.rs rely on catch_unwind.
