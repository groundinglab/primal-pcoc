# Android bridge workspace.
# hike is vendored from groundinglab/pcoc tag ref-rust-v2.0.4 (reference/rust/hike).
# Live Bari and index hosts are groundinglab.io.
[workspace]
resolver = "2"
members = ["vendor/hike", "bridge"]

[profile.dev.package."*"]
# Legs are not usable unoptimised. Same choice as the desktop app.
opt-level = 3

[profile.release]
lto = "thin"
