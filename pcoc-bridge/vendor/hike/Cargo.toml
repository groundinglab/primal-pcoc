# Vendored from groundinglab/pcoc origin/main
# 148d6bac84a6e8987ad4faab168881f9403523be (sibling checkout
# pcoc-main-android-ref). Tag ref-v2.0.0 is an earlier pin.
# Live Bari and index hosts are groundinglab.io (pcoc#317).
# tip.pcoc.app stays refused. tests/ is not included.

[package]
name = "hike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
getrandom = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# Keep the TLS stack on rustc 1.83. Newer url pulls idna 1; newer zeroize needs edition 2024.
url = "=2.5.2"
zeroize = "=1.8.2"
subtle = "=2.5.0"

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.8"
