# Vendored from groundinglab/pcoc draft PR #48 head 4043f35 (reference/rust/hike),
# NOT a release tag. Copied verbatim; tests/ is not included. Licence: Apache-2.0.
# TODO(before merge): once pcoc #48 merges and a ref-rust tag is cut, re-vendor
# from that tag and replace this header with the tag name. Do not ship from this.

[package]
name = "hike"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
getrandom = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
# asm: on aarch64, runtime HWCAP_SHA2 then sha256h; on x86_64, sha2-asm.
# Without asm, aarch64 falls back to the portable compress.
sha2 = { version = "0.10", features = ["asm"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# url 2.5.4+ pulls idna 1 (GHSA-h97m-ww89-6jmq fix). The lock pins idna_adapter 1.1 (unicode-rs backend) so the build stays on rustc 1.83; idna_adapter 1.2 pulls icu 2.x, which needs a newer rustc. Newer zeroize needs edition 2024.
url = "2.5.4"
zeroize = "=1.8.2"
subtle = "=2.5.0"

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = { version = "=0.10.8", features = ["asm"] }
