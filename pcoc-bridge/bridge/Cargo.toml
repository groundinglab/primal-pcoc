[package]
name = "pcoc-bridge"
description = "JNI bridge from the Android app to the vendored hike reference."
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "pcoc_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
hike = { path = "../vendor/hike" }
jni = { version = "=0.21.1", default-features = false }
serde_json = "=1.0.151"
sha2 = "0.10"
